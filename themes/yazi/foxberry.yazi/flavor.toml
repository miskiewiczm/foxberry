	{ url = "*.log", fg = "#6A7488" },

	# Lock files - overlay0 #4C566A
	{ url = "*.lock", fg = "#6A7488" },
	{ url = "*-lock.json", fg = "#6A7488" },

	# === BY MIME TYPE ===

	# Images - mauve
	{ mime = "image/*", fg = "#986393" },

	# Video - peach
	{ mime = "video/*", fg = "#B15E37" },

	# Audio - teal
	{ mime = "audio/*", fg = "#36816F" },

	# Archives - yellow
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#967044" },

