	{ url = "*", is = "orphan", fg = "#2E3440", bg = "#BF616A" },
	{ url = "*", is = "link", fg = "#36816F", italic = true },
	{ url = "*", is = "exec", fg = "#4E8044", bold = true },
	{ url = "*", is = "sticky", fg = "#967044" },
	{ url = "*", is = "block", fg = "#986393" },
	{ url = "*", is = "char", fg = "#986393" },
	{ url = "*", is = "fifo", fg = "#967044" },
	{ url = "*", is = "sock", fg = "#986393" },

	# Dummy files
	{ url = "*", is = "dummy", fg = "#2E3440", bg = "#BF616A" },
	{ url = "*/", is = "dummy", fg = "#2E3440", bg = "#BF616A" },

	# Custom directory colors
	{ url = "**/Documents/", fg = "#BE525A", bold = true },
	{ url = "**/Dydaktyka/", fg = "#B15E37", bold = true },

	# Fallback - directories ONLY get blue color
	{ url = "*/", fg = "#5374B3", bold = true },
