	{ mime = "application/rtf", fg = "#BE525A" },

	# Text/Markup
	{ mime = "text/{html,xml,css}", fg = "#BE525A" },
	{ mime = "application/{json,xml,yaml}", fg = "#36816F" },

	# Scripts/Code - green
	{ mime = "text/x-*", fg = "#4E8044" },
	{ mime = "application/x-{sh,shellscript,python,perl,ruby,php}", fg = "#4E8044" },
	{ mime = "application/javascript", fg = "#4E8044" },

