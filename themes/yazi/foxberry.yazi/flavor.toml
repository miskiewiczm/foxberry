# Foxberry flavor for yazi (based on nord.yazi by AdithyanA2005).
# Part of Foxberry, a light Nord theme. MIT license; see LICENSE and THIRD_PARTY_NOTICES.md.

[mgr]
cwd             = { fg = "#287F92" }
find_keyword    = { fg = "#967044", bold = true, italic = true, underline = true }
find_position   = { fg = "#986393", bg = "reset", bold = true, italic = true }
symlink_target  = { fg = "#36816F", italic = true }
marker_copied   = { fg = "#619756", bg = "#619756" }
marker_cut      = { fg = "#DA656D", bg = "#DA656D" }
marker_marked   = { fg = "#489784", bg = "#489784" }
marker_selected = { fg = "#AD8455", bg = "#AD8455" }
marker_symbol   = "│"
count_copied    = { fg = "#2E3440", bg = "#A3BE8C" }
count_cut       = { fg = "#2E3440", bg = "#BF616A" }
count_selected  = { fg = "#2E3440", bg = "#EBCB8B" }
border_symbol   = "│"
border_style    = { fg = "#8E97A8" }
syntect_theme   = ""
# from the nord.yazi flavor (keys not overridden below)
hovered = { reversed = true }
preview_hovered = { underline = true }
tab_active = { reversed = true }
tab_inactive = { fg = "#8E97A8" } # nord3
tab_width = 1


# tab bar: the flavor lost its separators
[tabs]
active    = { fg = "#2E3440", bg = "#8FBCBB", bold = true }
inactive  = { fg = "#36816F", bg = "#D8DEE9" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

# : }}}


# : Mode {{{

[mode]
# Use distinct Frost/Aurora colors for mode backgrounds, dark text
# Changed normal mode background to nord7 (Teal/Mint)
normal_main = { fg = "#2E3440", bg = "#8FBCBB", bold = true } # nord0 on nord7 (Teal/Mint)
normal_alt = { fg = "#36816F", bg = "#D8DEE9" }               # nord7 on nord1

# Select mode remains nord7 (Teal/Mint)
select_main = { fg = "#2E3440", bg = "#8FBCBB", bold = true } # nord0 on nord7 (Teal/Mint)
select_alt = { fg = "#36816F", bg = "#D8DEE9" }               # nord7 on nord1

# Unset mode remains nord11 (Red)
unset_main = { fg = "#2E3440", bg = "#BF616A", bold = true } # nord0 on nord11 (Red)
unset_alt = { fg = "#BE525A", bg = "#D8DEE9" }               # nord11 on nord1

# Status bar. yazi 26.x reads [status] as a struct with 11 fields,
# so all of them are required. The nord.yazi flavor sets only 8 (no overall/sep_left/
# sep_right), so the whole section silently fell back to yazi's defaults, which
# gave a green "N left" on a black bar. Separators are empty because the status
# line is drawn by yatline.
[status]
overall   = {}
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

perm_sep   = { fg = "#8E97A8" }                      # nord3
perm_type  = { fg = "#4E8044" }                      # nord14
perm_read  = { fg = "#967044" }                      # nord13
perm_write = { fg = "#BE525A" }                      # nord11
perm_exec  = { fg = "#287F92" }                      # nord8

progress_label  = { fg = "#2E3440", bold = true }    # nord6
progress_normal = { fg = "#287F92", bg = "#D8DEE9" } # nord8 on nord2
progress_error  = { fg = "#BE525A", bg = "#D8DEE9" } # nord11 on nord2

# : }}}


# : Pick {{{

[pick]
# File picker - Use a Frost blue for border, Aurora purple for active item
border = { fg = "#5374B3" }              # nord9
active = { fg = "#986393", bold = true } # nord15 (Purple)
inactive = { fg = "#3B4252" }            # nord4 - Default text color

# : }}}


# : Input {{{

[input]
# Input prompts - Frost blue border, default text, reverse selection
border = { fg = "#5374B3" }    # nord9
title = { fg = "#3B4252" }     # nord4
value = { fg = "#2E3440" }     # nord6 - Slightly brighter for input value
selected = { reversed = true }

# completion menu: the flavor only set border
[cmp]
border       = { fg = "#5374B3" }
active       = { reversed = true }
inactive     = {}
icon_file    = ""
icon_folder  = ""
icon_command = ""

# : }}}


# : Tasks {{{

[tasks]
# Tasks window - Frost blue border, Aurora purple for hovered task
border = { fg = "#5374B3" }                    # nord9
title = { fg = "#2E3440" }                     # nord6
hovered = { fg = "#986393", underline = true } # nord15 (Purple)

# key hints: the flavor lost border and cols
[which]
border          = { fg = "#5374B3" }
cols            = 3
mask            = { bg = "#D8DEE9" }
cand            = { fg = "#36816F" }
rest            = { fg = "#8E97A8" }
desc            = { fg = "#986393" }
separator       = "  "
separator_style = { fg = "#C9D0DC" }

# help screen: keys on/run were renamed to chord/action
[help]
border  = { fg = "#5374B3" }
chord   = { fg = "#36816F" }
action  = { fg = "#986393" }
hovered = { reversed = true, bold = true }
# from the nord.yazi flavor (keys not overridden below)
on = { fg = "#36816F" }                     # nord7 (Frost Mint) - Keybinding section label
run = { fg = "#986393" }                    # nord15 (Purple) - Command section label
footer = { fg = "#ECEFF4", bg = "#4C566A" }


# notifications: the flavor lost its icons
[notify]
title_info  = { fg = "#4E8044" }
title_warn  = { fg = "#967044" }
title_error = { fg = "#BE525A" }
icon_info   = ""
icon_warn   = ""
icon_error  = ""

