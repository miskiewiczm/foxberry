# Foxberry for kitty.
# Part of Foxberry, a light Nord theme. MIT license; see LICENSE and THIRD_PARTY_NOTICES.md.

foreground            #3B4252
background            #E5E9F0
selection_foreground  #2E3440
selection_background  #D8DEE9
url_color             #287F92

# Cursor: foxberry, the theme accent (4.1:1 with the text under it)
cursor                #A35E75
cursor_text_color     #ECEFF4

# black — nord1 / nord3
color0   #3B4252
color8   #4C566A

# red
color1   #BE525A
color9   #DA656D

# green
color2   #4E8044
color10  #619756

# yellow
color3   #967044
color11  #AD8455

# blue
color4   #5374B3
color12  #658ACD

# magenta
color5   #986393
color13  #B077AB

# cyan
color6   #287F92
color14  #489784

# white: greys instead of white (like GitHub Light), so text in color 7 stays visible
color7   #6A7488
color15  #8E97A8

# Tab bar: the active tab has the terminal background, so it reads as part of the
# window; inactive tabs sink into a darker bar (4.8:1 text, 1.27:1 tab edge)
tab_bar_background      #C9D0DC
active_tab_foreground   #2E3440
active_tab_background   #E5E9F0
inactive_tab_foreground #4C566A
inactive_tab_background #C9D0DC

# Window titles and split borders
window_title_bar_active_foreground   #287F92
window_title_bar_active_background   #E5E9F0
window_title_bar_inactive_foreground #8E97A8
window_title_bar_inactive_background #E5E9F0
active_border_color   #8E97A8
inactive_border_color #D8DEE9
bell_border_color     #AD8455

# macOS title bar in the theme color
macos_titlebar_color #E5E9F0

# Tab bar shape: straight edges, the active tab continues the window.
# The activity dot uses ANSI red (color1) from the active theme.
# Remove this block to keep your own tab bar layout.
tab_bar_style separator
tab_separator ""
tab_title_template "  {fmt.fg.color1}{bell_symbol}{activity_symbol}{fmt.fg.tab}{index} {title}  "
active_tab_font_style bold
inactive_tab_font_style normal
