# Foxberry pastel prompt for Starship.
# Part of Foxberry, a light Nord theme. MIT license; see LICENSE and THIRD_PARTY_NOTICES.md.

"$schema" = 'https://starship.rs/config-schema.json'

format = """
$os\
[](bg:peach fg:red)\
$directory\
[](bg:yellow fg:peach)\
$git_branch\
$git_status\
[](fg:yellow bg:green)\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:green bg:nord9)\
$conda\
[](fg:nord9 bg:fox)\
$time\
[ ](fg:fox)\
$cmd_duration\
$line_break\
\n$character"""

palette = 'foxberry'

[os]
disabled = false
style = "bg:red fg:crust"
format = '[ $symbol]($style)'

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵 "
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
style_user = "bg:red fg:crust"
style_root = "bg:red fg:crust"
format = '[ $user]($style)'

[directory]
style = "bold bg:peach fg:crust"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:yellow"
format = '[[ $symbol $branch ](fg:crust bg:yellow)]($style)'

[git_status]
style = "bg:yellow"
format = '[[($all_status$ahead_behind )](fg:crust bg:yellow)]($style)'

[nodejs]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[c]
symbol = " "
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[rust]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[golang]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[php]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[java]
symbol = " "
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[kotlin]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[haskell]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[python]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version)(\(#$virtualenv\)) ](fg:crust bg:green)]($style)'

[docker_context]
symbol = ""
style = "bg:sapphire"
format = '[[ $symbol( $context) ](fg:crust bg:sapphire)]($style)'

[conda]
symbol = "  "
style = "fg:crust bg:nord9"
format = '[$symbol$environment ]($style)'
ignore_base = false

[time]
disabled = false
time_format = "%R"
style = "bg:fox"
format = '[[  $time ](fg:crust bg:fox)]($style)'

[line_break]
disabled = true

[character]
disabled = false
# Separate prompt_* names: ❯ sits on the terminal background, not on a segment,
# so the light palette needs dark accents instead of light tints
success_symbol = '[❯](bold fg:prompt_ok)'
error_symbol = '[❯](bold fg:prompt_err)'
vimcmd_symbol = '[❮](bold fg:prompt_ok)'
vimcmd_replace_one_symbol = '[❮](bold fg:prompt_vi)'
vimcmd_replace_symbol = '[❮](bold fg:prompt_vi)'
vimcmd_visual_symbol = '[❮](bold fg:prompt_visual)'

[cmd_duration]
show_milliseconds = true
format = " in $duration "
style = "bg:fox"
disabled = false
show_notifications = true
min_time_to_notify = 45000

[palettes.foxberry]
# Polar Night / Snow Storm, unchanged (names kept for compatibility)
nord0 = "#2e3440"
nord1 = "#3b4252"
nord2 = "#434c5e"
nord3 = "#4c566a"
nord4 = "#d8dee9"
nord5 = "#e5e9f0"
nord6 = "#eceff4"
# Accents as text on the terminal background: text shades
nord7 = "#36816f"
nord8 = "#287f92"
nord10 = "#3f79a8"
nord11 = "#be525a"
nord12 = "#b15e37"
nord13 = "#967044"
nord14 = "#4e8044"
nord15 = "#986393"
# nord9 is a segment background here (conda), so it is a badge
nord9 = "#a7bdd4"
# Segments: badges (pastels) with crust = nord0 text
red = "#d5989e"
peach = "#deab9b"
yellow = "#e5c4a1"
green = "#aac396"
sapphire = "#96adc9"
lavender = "#cab0c6"
fox = "#dec0cc"
crust = "#2e3440"
# ❯ on the terminal background: text shades
prompt_ok = "#4e8044"
prompt_err = "#be525a"
prompt_vi = "#986393"
prompt_visual = "#967044"
